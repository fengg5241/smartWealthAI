<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartRAG - Multi-Tenant Knowledge Base</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>R</text></svg>">
<style>
:root {
  --primary: #2563eb;
  --primary-light: #eff6ff;
  --success: #16a34a;
  --warning: #f59e0b;
  --danger: #dc2626;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #64748b;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 20px; font-weight: 700; color: var(--primary); }
.tenant-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 600;
}
.tenant-badge .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--success);
}
.header-right { display: flex; align-items: center; gap: 12px; }
.header-right label { font-size:13px; color:var(--text-muted); }
.header-right select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  background: white;
  cursor: pointer;
  min-width: 160px;
}
.header-right select:focus { outline: none; border-color: var(--primary); }

/* Main */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex-shrink: 0;
}
.sidebar h3 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
}
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--primary);
  background: var(--primary-light);
}
.upload-zone .icon { font-size: 32px; margin-bottom: 8px; }
.upload-zone p { font-size: 13px; color: var(--text-muted); }
.upload-zone .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
#fileInput { display: none; }

/* Upload progress */
.upload-progress-wrap {
  display: none;
  flex-direction: column;
  gap: 6px;
}
.upload-progress-wrap.active { display: flex; }
.upload-progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.upload-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--primary);
  border-radius: 3px;
  transition: width .3s;
}
.upload-progress-fill.error { background: var(--danger); }
.upload-progress-label {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.upload-progress-label.success { color: var(--success); }
.upload-progress-label.error { color: var(--danger); }

.doc-list { font-size: 13px; margin-top: 4px; }
.doc-list .doc-item {
  padding: 6px 8px;
  border-radius: 4px;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 6px;
  font-size: 12px;
}

/* Chat */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chat-empty {
  margin: auto;
  text-align: center;
  color: var(--text-muted);
  max-width: 360px;
}
.chat-empty .icon { font-size: 48px; margin-bottom: 12px; }
.chat-empty h2 { font-size: 18px; margin-bottom: 4px; }
.chat-empty p { font-size: 14px; line-height: 1.5; }
.message {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.6;
  animation: fadeIn .2s;
  white-space: pre-wrap;
  word-wrap: break-word;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
.message.user {
  align-self: flex-end;
  background: var(--primary);
  color: white;
}
.message.assistant {
  align-self: flex-start;
  background: var(--card);
  border: 1px solid var(--border);
}
.message .sources {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}
.message.error {
  align-self: flex-start;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--danger);
}

.chat-input-area {
  padding: 16px 24px;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
}
.chat-input-area input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
}
.chat-input-area input:focus { outline: none; border-color: var(--primary); }
.chat-input-area button {
  padding: 10px 24px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
  white-space: nowrap;
}
.chat-input-area button:hover { background: #1d4ed8; }
.chat-input-area button:disabled { background: #94a3b8; cursor: not-allowed; }

/* Spinner */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
.assistant .spinner {
  border-color: rgba(0,0,0,.1);
  border-top-color: var(--primary);
}
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo">SmartRAG</span>
    <span class="tenant-badge" id="tenantBadge" style="display:none">
      <span class="dot"></span>
      <span id="tenantName"></span>
    </span>
  </div>
  <div class="header-right">
    <label for="tenantSelect">Enterprise:</label>
    <select id="tenantSelect">
      <option value="">-- Select Enterprise --</option>
      <option value="acme_corp">ACME Corp</option>
      <option value="globex_inc">Globex Inc</option>
    </select>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <h3>Document Management</h3>
    <div class="upload-zone" id="uploadZone">
      <div class="icon">📄</div>
      <p>Click or drag to upload</p>
      <p class="hint">Supports PDF, DOCX</p>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx">

    <div class="upload-progress-wrap" id="uploadProgressWrap">
      <div class="upload-progress-bar">
        <div class="upload-progress-fill" id="uploadProgressFill"></div>
      </div>
      <div class="upload-progress-label" id="uploadProgressLabel">Uploading...</div>
    </div>

    <div class="doc-list" id="docList"></div>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty" id="chatEmpty">
        <div class="icon">💬</div>
        <h2>Enterprise Knowledge Base Q&A</h2>
        <p>Select an enterprise, upload a document, then ask questions based on its content.</p>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type your question..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
const TENANTS = {
  acme_corp: 'ACME Corp',
  globex_inc: 'Globex Inc'
};

let currentTenant = '';
let uploadedDocs = [];

document.getElementById('tenantSelect').addEventListener('change', function(e) {
  currentTenant = e.target.value;
  if (currentTenant) {
    document.getElementById('tenantName').textContent = TENANTS[currentTenant];
    document.getElementById('tenantBadge').style.display = 'inline-flex';
  } else {
    document.getElementById('tenantBadge').style.display = 'none';
  }
  clearChat();
});

// ---- File Upload ----
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const progressWrap = document.getElementById('uploadProgressWrap');
const progressFill = document.getElementById('uploadProgressFill');
const progressLabel = document.getElementById('uploadProgressLabel');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    uploadFile(e.dataTransfer.files[0]);
  }
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
});

function setUploadProgress(pct, label, type) {
  progressWrap.classList.add('active');
  progressFill.style.width = pct + '%';
  progressFill.className = 'upload-progress-fill' + (type === 'error' ? ' error' : '');
  progressLabel.textContent = label;
  progressLabel.className = 'upload-progress-label' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
  if (type === 'success' || type === 'error') {
    setTimeout(() => { progressWrap.classList.remove('active'); }, type === 'success' ? 4000 : 8000);
  }
}

async function uploadFile(file) {
  if (!currentTenant) {
    setUploadProgress(100, 'Please select an enterprise first', 'error');
    return;
  }

  const formData = new FormData();
  formData.append('file', file);

  setUploadProgress(0, 'Starting upload...', '');

  // Use XMLHttpRequest for progress tracking
  const xhr = new XMLHttpRequest();

  const promise = new Promise((resolve, reject) => {
    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        setUploadProgress(pct, `Uploading... ${pct}%`, '');
      }
    });

    xhr.addEventListener('load', () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          resolve(JSON.parse(xhr.responseText));
        } catch { reject(new Error('Invalid server response')); }
      } else {
        try {
          const err = JSON.parse(xhr.responseText);
          reject(new Error(err.error || `Upload failed (HTTP ${xhr.status})`));
        } catch {
          reject(new Error(`Upload failed (HTTP ${xhr.status})`));
        }
      }
    });

    xhr.addEventListener('error', () => reject(new Error('Network error during upload')));
    xhr.addEventListener('abort', () => reject(new Error('Upload cancelled')));

    xhr.open('POST', '/api/documents/upload');
    xhr.setRequestHeader('X-Tenant-ID', currentTenant);
    xhr.send(formData);
  });

  try {
    const data = await promise;
    setUploadProgress(100, `Uploaded: ${data.fileName} (${data.chunks} chunks)`, 'success');
    uploadedDocs.push(data.fileName);
    refreshDocList();
  } catch (err) {
    setUploadProgress(100, err.message, 'error');
  }
}

function refreshDocList() {
  const el = document.getElementById('docList');
  if (uploadedDocs.length === 0) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">Uploaded documents:</div>';
  uploadedDocs.forEach(name => {
    el.insertAdjacentHTML('beforeend', `<div class="doc-item">📎 ${escapeHtml(name)}</div>`);
  });
}

// ---- Chat ----
function clearChat() {
  document.getElementById('chatMessages').innerHTML = `
    <div class="chat-empty" id="chatEmpty">
      <div class="icon">💬</div>
      <h2>Enterprise Knowledge Base Q&A</h2>
      <p>Select an enterprise, upload a document, then ask questions based on its content.</p>
    </div>`;
}

const FETCH_TIMEOUT = 45000;

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const question = input.value.trim();
  if (!question) return;

  if (!currentTenant) {
    alert('Please select an enterprise first');
    return;
  }

  const chatEmpty = document.getElementById('chatEmpty');
  if (chatEmpty) chatEmpty.remove();

  const messages = document.getElementById('chatMessages');

  // Add user message
  messages.insertAdjacentHTML('beforeend',
    `<div class="message user">${escapeHtml(question)}</div>`);

  // Add loading message
  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'message assistant';
  loadingDiv.innerHTML = '<span class="spinner"></span> Thinking...';
  messages.appendChild(loadingDiv);
  messages.scrollTop = messages.scrollHeight;

  input.value = '';
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  // Create abort controller for timeout
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);

  try {
    const resp = await fetch('/api/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Tenant-ID': currentTenant
      },
      body: JSON.stringify({ message: question }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    const data = await resp.json();

    loadingDiv.remove();
    let html;

    if (!resp.ok) {
      html = `<div class="message error">Error: ${escapeHtml(data.error || `Request failed (HTTP ${resp.status})`)}</div>`;
    } else {
      html = `<div class="message assistant">${escapeHtml(data.answer || '')}`;
      if (data.sources && data.sources.length > 0) {
        html += `<div class="sources">📎 Sources: ${data.sources.map(s => escapeHtml(s)).join(', ')}</div>`;
      }
      html += '</div>';
    }
    messages.insertAdjacentHTML('beforeend', html);
  } catch (err) {
    clearTimeout(timeoutId);
    loadingDiv.remove();
    let errorMsg;
    if (err.name === 'AbortError') {
      errorMsg = 'Request timed out. Please check your API key configuration and try again.';
    } else {
      errorMsg = 'Network error: ' + err.message;
    }
    messages.insertAdjacentHTML('beforeend',
      `<div class="message error">${escapeHtml(errorMsg)}</div>`);
  } finally {
    sendBtn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}
</script>
</body>
</html>
