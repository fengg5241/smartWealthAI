<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartRAG - Multi-Tenant Knowledge Base</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white'>R</text></svg>">
<style>
:root {
  --primary: #2563eb;
  --primary-light: #eff6ff;
  --success: #16a34a;
  --warning: #f59e0b;
  --danger: #dc2626;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #64748b;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 20px; font-weight: 700; color: var(--primary); }
.tenant-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 13px;
  font-weight: 600;
}
.tenant-badge .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--success);
}
.header-right { display: flex; align-items: center; gap: 12px; }
.header-right label { font-size:13px; color:var(--text-muted); }
.header-right select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  background: white;
  cursor: pointer;
  min-width: 160px;
}
.header-right select:focus { outline: none; border-color: var(--primary); }
.mode-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.mode-tag.admin { background: #fef3c7; color: #92400e; }
.mode-tag.customer { background: #dcfce7; color: #166534; }

/* Main */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex-shrink: 0;
}
.sidebar h3 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
}
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--primary);
  background: var(--primary-light);
}
.upload-zone .icon { font-size: 32px; margin-bottom: 8px; }
.upload-zone p { font-size: 13px; color: var(--text-muted); }
.upload-zone .hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
#fileInput { display: none; }

/* Upload progress */
.upload-progress-wrap {
  display: none;
  flex-direction: column;
  gap: 6px;
}
.upload-progress-wrap.active { display: flex; }
.upload-progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.upload-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--primary);
  border-radius: 3px;
  transition: width .3s;
}
.upload-progress-fill.error { background: var(--danger); }
.upload-progress-label {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.upload-progress-label.success { color: var(--success); }
.upload-progress-label.error { color: var(--danger); }

.doc-list { font-size: 13px; margin-top: 4px; overflow-y: auto; max-height: 300px; }
.doc-list .doc-item {
  padding: 6px 8px;
  border-radius: 4px;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 6px;
  font-size: 12px;
}
.doc-list .doc-item:hover { background: var(--primary-light); }
.doc-list .doc-item .file-icon { flex-shrink: 0; }
.doc-list .doc-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-list .doc-item .file-type-tag {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--border);
  color: var(--text-muted);
  flex-shrink: 0;
}
.doc-list .doc-item .del-btn {
  flex-shrink: 0;
  width: 20px; height: 20px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  line-height: 20px;
  text-align: center;
  visibility: hidden;
}
.doc-list .doc-item:hover .del-btn { visibility: visible; }
.doc-list .doc-item .del-btn:hover { background: #fecaca; color: var(--danger); }
.doc-list .empty-hint { font-size: 12px; color: var(--text-muted); padding: 8px; text-align: center; }

/* Tenant Management */
.tenant-mgmt { margin-top: 8px; }
.tenant-mgmt h3 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.tenant-create {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tenant-create input {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
}
.tenant-create input:focus { outline: none; border-color: var(--primary); }
.tenant-create button {
  padding: 8px 12px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.tenant-create button:hover { background: #1d4ed8; }
.tenant-create-msg {
  font-size: 12px;
  margin-top: 6px;
  min-height: 18px;
}
.tenant-create-msg.success { color: var(--success); }
.tenant-create-msg.error { color: var(--danger); }
.tenant-list { margin-top: 12px; }
.tenant-list .t-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  border-radius: 4px;
  font-size: 12px;
}
.tenant-list .t-item:hover { background: var(--primary-light); }
.tenant-list .t-item .t-name { color: var(--text); font-weight: 500; }
.tenant-list .t-item .t-id { color: var(--text-muted); font-size: 11px; }
.tenant-list .t-item .t-del {
  width: 20px; height: 20px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  line-height: 20px;
  text-align: center;
  visibility: hidden;
}
.tenant-list .t-item:hover .t-del { visibility: visible; }
.tenant-list .t-item .t-del:hover { background: #fecaca; color: var(--danger); }

/* Chat */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.chat-empty {
  margin: auto;
  text-align: center;
  color: var(--text-muted);
  max-width: 360px;
}
.chat-empty .icon { font-size: 48px; margin-bottom: 12px; }
.chat-empty h2 { font-size: 18px; margin-bottom: 4px; }
.chat-empty p { font-size: 14px; line-height: 1.5; }
.message {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.6;
  animation: fadeIn .2s;
  white-space: pre-wrap;
  word-wrap: break-word;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
.message.user {
  align-self: flex-end;
  background: var(--primary);
  color: white;
}
.message.assistant {
  align-self: flex-start;
  background: var(--card);
  border: 1px solid var(--border);
}
.message .sources {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}
.message.error {
  align-self: flex-start;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--danger);
}

.chat-input-area {
  padding: 16px 24px;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
}
.chat-input-area input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
}
.chat-input-area input:focus { outline: none; border-color: var(--primary); }
.chat-input-area button {
  padding: 10px 24px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
  white-space: nowrap;
}
.chat-input-area button:hover { background: #1d4ed8; }
.chat-input-area button:disabled { background: #94a3b8; cursor: not-allowed; }

/* Spinner */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
.assistant .spinner {
  border-color: rgba(0,0,0,.1);
  border-top-color: var(--primary);
}
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span class="logo">SmartRAG</span>
    <span class="tenant-badge" id="tenantBadge" style="display:none">
      <span class="dot"></span>
      <span id="tenantName"></span>
    </span>
    <span class="mode-tag" id="modeTag"></span>
  </div>
  <div class="header-right" id="headerRight">
    <label for="tenantSelect">Enterprise:</label>
    <select id="tenantSelect">
      <option value="">-- Loading... --</option>
    </select>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <h3>Document Management</h3>
    <div class="upload-zone" id="uploadZone">
      <div class="icon">📄</div>
      <p>Click or drag to upload</p>
      <p class="hint">Supports PDF, DOCX, XLSX, XLS — Max 10MB</p>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.xls">

    <div class="upload-progress-wrap" id="uploadProgressWrap">
      <div class="upload-progress-bar">
        <div class="upload-progress-fill" id="uploadProgressFill"></div>
      </div>
      <div class="upload-progress-label" id="uploadProgressLabel">Uploading...</div>
    </div>

    <div class="doc-list" id="docList"></div>

    <div class="tenant-mgmt" id="tenantMgmt" style="display:none">
      <h3>Tenant Management</h3>
      <div class="tenant-create">
        <input type="text" id="newTenantId" placeholder="tenant_id (e.g. acme_corp)" maxlength="50">
        <input type="text" id="newTenantName" placeholder="Display name (e.g. ACME Corp)" maxlength="100">
        <button onclick="createTenant()">+ Create Tenant</button>
      </div>
      <div class="tenant-create-msg" id="tenantCreateMsg"></div>
      <div class="tenant-list" id="tenantList"></div>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty" id="chatEmpty">
        <div class="icon">💬</div>
        <h2>Enterprise Knowledge Base Q&A</h2>
        <p id="chatEmptyHint">Select an enterprise, upload a document, then ask questions based on its content.</p>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type your question..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
const FILE_ICONS = { PDF: '📕', DOCX: '📘', XLSX: '📗', XLS: '📗' };
const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB

let currentTenant = '';
let isAdmin = false;
let adminKey = '';
let tenantMap = {}; // tenantId -> name, loaded from API

// ---- Init: parse URL params ----
async function init() {
  const params = new URLSearchParams(window.location.search);
  const tenantParam = params.get('tenant');
  const adminParam = params.get('admin');

  if (adminParam === 'true') {
    isAdmin = true;
    adminKey = params.get('key') || '';
    document.getElementById('modeTag').textContent = 'ADMIN';
    document.getElementById('modeTag').className = 'mode-tag admin';
    document.getElementById('chatEmptyHint').textContent = 'Select an enterprise, upload documents, then demo Q&A.';
    document.getElementById('tenantMgmt').style.display = 'block';
  } else if (tenantParam) {
    isAdmin = false;
    currentTenant = tenantParam;
    document.getElementById('modeTag').textContent = 'Customer';
    document.getElementById('modeTag').className = 'mode-tag customer';
    document.getElementById('headerRight').style.display = 'none';
    document.getElementById('tenantBadge').style.display = 'inline-flex';
    document.getElementById('tenantName').textContent = tenantParam;
  }

  await loadTenants();

  if (!isAdmin && currentTenant) {
    if (!(await validateTenant(currentTenant))) {
      return;
    }
  }

  if (currentTenant) {
    loadDocList();
  }
  updateTenantBadge();
}

async function validateTenant(tenantId) {
  try {
    const resp = await fetch('/api/documents', { headers: { 'X-Tenant-ID': tenantId } });
    if (resp.status === 404) {
      const data = await resp.json();
      if (data.error && data.error.startsWith('Tenant')) {
        showTenantPageError(data.error);
        return false;
      }
    }
    return true;
  } catch (err) {
    return true; // network error — let the user try
  }
}

function showTenantPageError(msg) {
  document.getElementById('headerRight').style.display = 'none';
  document.getElementById('tenantBadge').style.display = 'none';
  document.getElementById('modeTag').style.display = 'none';
  document.getElementById('docList').innerHTML = '';
  document.getElementById('tenantMgmt').style.display = 'none';
  document.getElementById('uploadZone').style.display = 'none';
  document.getElementById('chatMessages').innerHTML = `
    <div class="chat-empty">
      <div class="icon">⚠️</div>
      <h2>${escapeHtml(msg)}</h2>
      <p style="margin-top:8px">Please check the link or contact the administrator for a valid tenant URL.</p>
    </div>`;
  document.getElementById('chatInput').disabled = true;
  document.getElementById('sendBtn').disabled = true;
}

init();

// ---- Tenant Management ----
async function loadTenants() {
  if (!isAdmin) return;
  try {
    const resp = await fetch('/api/admin/tenants', { headers: adminHeaders() });
    if (!resp.ok) return;
    const tenants = await resp.json();
    tenantMap = {};
    const sel = document.getElementById('tenantSelect');
    sel.innerHTML = '<option value="">-- Select Enterprise --</option>';
    tenants.forEach(t => {
      tenantMap[t.tenantId] = t.name;
      const opt = document.createElement('option');
      opt.value = t.tenantId;
      opt.textContent = t.name + ' (' + t.tenantId + ')';
      sel.appendChild(opt);
    });
    renderTenantList(tenants);
  } catch (err) {
    console.error('Failed to load tenants', err);
  }
}

function renderTenantList(tenants) {
  const el = document.getElementById('tenantList');
  if (tenants.length === 0) {
    el.innerHTML = '<div class="empty-hint">No tenants yet</div>';
    return;
  }
  let html = '';
  tenants.forEach(t => {
    html += `<div class="t-item">
      <div><span class="t-name">${escapeHtml(t.name)}</span>&nbsp;<span class="t-id">${escapeHtml(t.tenantId)}</span></div>
      <button class="t-del" title="Delete" onclick="deleteTenant('${escapeHtml(t.tenantId)}')">&times;</button>
    </div>`;
  });
  el.innerHTML = html;
}

async function createTenant() {
  const tid = document.getElementById('newTenantId').value.trim();
  const tname = document.getElementById('newTenantName').value.trim();
  const msg = document.getElementById('tenantCreateMsg');
  if (!tid || !tname) {
    msg.textContent = 'Both fields are required';
    msg.className = 'tenant-create-msg error';
    return;
  }
  try {
    const resp = await fetch('/api/admin/tenants', {
      method: 'POST',
      headers: { ...adminHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ tenantId: tid, name: tname })
    });
    const data = await resp.json();
    if (!resp.ok) {
      msg.textContent = data.error || 'Failed';
      msg.className = 'tenant-create-msg error';
      return;
    }
    msg.textContent = 'Created ' + tid;
    msg.className = 'tenant-create-msg success';
    document.getElementById('newTenantId').value = '';
    document.getElementById('newTenantName').value = '';
    await loadTenants();
  } catch (err) {
    msg.textContent = 'Network error';
    msg.className = 'tenant-create-msg error';
  }
}

async function deleteTenant(tenantId) {
  if (!confirm('Delete tenant "' + tenantId + '"? This cannot be undone.')) return;
  try {
    const resp = await fetch('/api/admin/tenants/' + encodeURIComponent(tenantId), {
      method: 'DELETE',
      headers: adminHeaders()
    });
    if (!resp.ok) {
      const data = await resp.json();
      alert('Delete failed: ' + (data.error || resp.status));
      return;
    }
    await loadTenants();
  } catch (err) {
    alert('Network error: ' + err.message);
  }
}

function updateTenantBadge() {
  if (currentTenant) {
    document.getElementById('tenantName').textContent = tenantMap[currentTenant] || currentTenant;
  }
}

function adminHeaders() {
  const h = {};
  if (isAdmin && adminKey) h['X-Admin-Key'] = adminKey;
  return h;
}

document.getElementById('tenantSelect').addEventListener('change', function(e) {
  currentTenant = e.target.value;
  if (currentTenant) {
    document.getElementById('tenantName').textContent = tenantMap[currentTenant] || currentTenant;
    document.getElementById('tenantBadge').style.display = 'inline-flex';
  } else {
    document.getElementById('tenantBadge').style.display = 'none';
  }
  clearChat();
  loadDocList();
});

// ---- File Upload ----
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const progressWrap = document.getElementById('uploadProgressWrap');
const progressFill = document.getElementById('uploadProgressFill');
const progressLabel = document.getElementById('uploadProgressLabel');

if (uploadZone) {
  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      uploadFile(e.dataTransfer.files[0]);
    }
  });
}

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
});

function setUploadProgress(pct, label, type) {
  progressWrap.classList.add('active');
  progressFill.style.width = pct + '%';
  progressFill.className = 'upload-progress-fill' + (type === 'error' ? ' error' : '');
  progressLabel.textContent = label;
  progressLabel.className = 'upload-progress-label' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
  if (type === 'success' || type === 'error') {
    setTimeout(() => { progressWrap.classList.remove('active'); }, type === 'success' ? 4000 : 8000);
  }
}

async function uploadFile(file) {
  if (!currentTenant) {
    setUploadProgress(100, 'Please select an enterprise first', 'error');
    return;
  }

  if (file.size > MAX_FILE_SIZE) {
    setUploadProgress(100, 'File too large. Maximum upload size is 10MB.', 'error');
    return;
  }

  const formData = new FormData();
  formData.append('file', file);

  setUploadProgress(0, 'Starting upload...', '');

  const xhr = new XMLHttpRequest();

  const promise = new Promise((resolve, reject) => {
    xhr.upload.addEventListener('progress', e => {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        setUploadProgress(pct, `Uploading... ${pct}%`, '');
      }
    });

    xhr.addEventListener('load', () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          resolve(JSON.parse(xhr.responseText));
        } catch { reject(new Error('Invalid server response')); }
      } else {
        try {
          const err = JSON.parse(xhr.responseText);
          reject(new Error(err.error || `Upload failed (HTTP ${xhr.status})`));
        } catch {
          reject(new Error(`Upload failed (HTTP ${xhr.status})`));
        }
      }
    });

    xhr.addEventListener('error', () => reject(new Error('Network error during upload')));
    xhr.addEventListener('abort', () => reject(new Error('Upload cancelled')));

    xhr.open('POST', '/api/documents/upload');
    xhr.setRequestHeader('X-Tenant-ID', currentTenant);
    if (isAdmin && adminKey) {
      xhr.setRequestHeader('X-Admin-Key', adminKey);
    }
    xhr.send(formData);
  });

  try {
    const data = await promise;
    setUploadProgress(100, `Uploaded: ${data.fileName} (${data.chunks} chunks)`, 'success');
    loadDocList();
  } catch (err) {
    setUploadProgress(100, err.message, 'error');
  }
}

// ---- Document List ----
async function loadDocList() {
  const el = document.getElementById('docList');
  if (!currentTenant) {
    el.innerHTML = '<div class="empty-hint">Select an enterprise to view documents</div>';
    return;
  }

  try {
    const headers = { 'X-Tenant-ID': currentTenant };
    if (isAdmin && adminKey) headers['X-Admin-Key'] = adminKey;

    const resp = await fetch('/api/documents', { headers });
    if (!resp.ok) throw new Error('Failed to load documents');

    const docs = await resp.json();
    if (docs.length === 0) {
      el.innerHTML = '<div class="empty-hint">No documents yet</div>';
      return;
    }

    let html = '';
    docs.forEach(doc => {
      const icon = FILE_ICONS[doc.fileType] || '📎';
      html += `<div class="doc-item">
        <span class="file-icon">${icon}</span>
        <span class="file-name" title="${escapeHtml(doc.fileName)}">${escapeHtml(doc.fileName)}</span>
        <span class="file-type-tag">${escapeHtml(doc.fileType)}</span>`;
        html += `<button class="del-btn" title="Delete" onclick="deleteDocument('${escapeHtml(doc.fileName)}')">&times;</button>`;
      html += `</div>`;
    });
    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = '<div class="empty-hint" style="color:var(--danger)">Failed to load</div>';
  }
}

async function deleteDocument(fileName) {
  if (!confirm(`Delete "${fileName}"? This will remove all its chunks from the knowledge base.`)) return;

  try {
    const headers = { 'X-Tenant-ID': currentTenant };
    if (isAdmin && adminKey) headers['X-Admin-Key'] = adminKey;

    const resp = await fetch('/api/documents/' + encodeURIComponent(fileName), {
      method: 'DELETE',
      headers
    });
    if (!resp.ok) {
      const err = await resp.json();
      alert('Delete failed: ' + (err.error || resp.status));
      return;
    }
    loadDocList();
  } catch (err) {
    alert('Network error: ' + err.message);
  }
}

// ---- Chat ----
function clearChat() {
  document.getElementById('chatMessages').innerHTML = `
    <div class="chat-empty" id="chatEmpty">
      <div class="icon">💬</div>
      <h2>Enterprise Knowledge Base Q&A</h2>
      <p>Ask questions based on uploaded documents.</p>
    </div>`;
}

const FETCH_TIMEOUT = 45000;

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const question = input.value.trim();
  if (!question) return;

  if (!currentTenant) {
    alert('Please select an enterprise first');
    return;
  }

  const chatEmpty = document.getElementById('chatEmpty');
  if (chatEmpty) chatEmpty.remove();

  const messages = document.getElementById('chatMessages');

  messages.insertAdjacentHTML('beforeend',
    `<div class="message user">${escapeHtml(question)}</div>`);

  const loadingDiv = document.createElement('div');
  loadingDiv.className = 'message assistant';
  loadingDiv.innerHTML = '<span class="spinner"></span> Thinking...';
  messages.appendChild(loadingDiv);
  messages.scrollTop = messages.scrollHeight;

  input.value = '';
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);

  try {
    const headers = {
      'Content-Type': 'application/json',
      'X-Tenant-ID': currentTenant
    };
    if (isAdmin && adminKey) headers['X-Admin-Key'] = adminKey;

    const resp = await fetch('/api/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify({ message: question }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    const data = await resp.json();

    loadingDiv.remove();
    let html;

    if (!resp.ok) {
      html = `<div class="message error">Error: ${escapeHtml(data.error || `Request failed (HTTP ${resp.status})`)}</div>`;
    } else {
      html = `<div class="message assistant">${escapeHtml(data.answer || '')}`;
      if (data.sources && data.sources.length > 0) {
        html += `<div class="sources">📎 Sources: ${data.sources.map(s => escapeHtml(s)).join(', ')}</div>`;
      }
      html += '</div>';
    }
    messages.insertAdjacentHTML('beforeend', html);
  } catch (err) {
    clearTimeout(timeoutId);
    loadingDiv.remove();
    let errorMsg;
    if (err.name === 'AbortError') {
      errorMsg = 'Request timed out. Please check your API key configuration and try again.';
    } else {
      errorMsg = 'Network error: ' + err.message;
    }
    messages.insertAdjacentHTML('beforeend',
      `<div class="message error">${escapeHtml(errorMsg)}</div>`);
  } finally {
    sendBtn.disabled = false;
    messages.scrollTop = messages.scrollHeight;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}
