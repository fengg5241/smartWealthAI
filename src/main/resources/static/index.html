<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wealth AI Demo</title>
    <style>
        :root {
            --bg: #f3efe7;
            --panel: rgba(255, 252, 246, 0.9);
            --line: rgba(76, 57, 37, 0.15);
            --text: #2e2218;
            --muted: #7d6a57;
            --accent: #0f766e;
            --accent-2: #d97706;
            --shadow: 0 22px 60px rgba(67, 44, 22, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(217, 119, 6, 0.18), transparent 32%),
                linear-gradient(135deg, #f7f2e8 0%, #ece7de 48%, #f8f4ec 100%);
        }

        .page {
            width: min(1280px, calc(100vw - 32px));
            margin: 24px auto 48px;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.3fr 0.9fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .hero-card,
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .hero-card {
            padding: 28px;
        }

        .eyebrow {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(15, 118, 110, 0.1);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 16px 0 12px;
            font-size: clamp(32px, 5vw, 56px);
            line-height: 0.95;
            letter-spacing: -0.04em;
        }

        .hero p {
            color: var(--muted);
            line-height: 1.7;
            margin: 0;
        }

        .hero-side {
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stat {
            padding: 16px 0;
            border-bottom: 1px solid var(--line);
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 20px;
        }

        .panel {
            padding: 22px;
        }

        .panel h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        select,
        textarea,
        button {
            width: 100%;
            border-radius: 18px;
            border: 1px solid var(--line);
            font: inherit;
        }

        select,
        textarea {
            padding: 14px 16px;
            background: #fffdfa;
            color: var(--text);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            padding: 14px 18px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #115e59);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 18px 30px rgba(15, 118, 110, 0.22);
        }

        button:hover {
            transform: translateY(-1px);
        }

        .muted-note {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .content-stack {
            display: grid;
            gap: 20px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .mini-card {
            padding: 16px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid var(--line);
            border-radius: 22px;
        }

        .mini-card h3 {
            margin: 0 0 8px;
            font-size: 15px;
        }

        .mini-card p,
        .mini-card li {
            color: var(--muted);
            line-height: 1.6;
            margin: 0;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 8px 10px;
            border-radius: 999px;
            background: rgba(217, 119, 6, 0.1);
            color: #92400e;
            font-size: 12px;
            font-weight: 700;
        }

        .answer {
            white-space: pre-wrap;
            line-height: 1.8;
            color: var(--text);
        }

        .loading {
            color: var(--accent);
            font-weight: 700;
        }

        @media (max-width: 980px) {
            .hero,
            .grid,
            .card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <section class="hero">
        <div class="hero-card">
            <span class="eyebrow">RAG + Spring AI</span>
            <h1>财富管理 AI 顾问 Demo</h1>
            <p>这个页面直接调用后端 Spring Boot 接口，展示用户财富分析、RAG 候选产品筛选，以及大模型最终给出的理财建议与推荐结果。</p>
        </div>
        <div class="hero-card hero-side">
            <div class="stat">
                <div class="stat-label">核心能力</div>
                <div class="stat-value">交易分析</div>
            </div>
            <div class="stat">
                <div class="stat-label">增强方式</div>
                <div class="stat-value">RAG 检索</div>
            </div>
            <div class="stat">
                <div class="stat-label">最终输出</div>
                <div class="stat-value">LLM 推荐</div>
            </div>
        </div>
    </section>

    <section class="grid">
        <aside class="panel">
            <h2>调试面板</h2>
            <div class="field">
                <label for="userSelect">选择用户</label>
                <select id="userSelect"></select>
            </div>
            <div class="field">
                <label for="messageInput">咨询问题</label>
                <textarea id="messageInput">我想在目标期限内完成储蓄目标，结合我的风险等级和最近两个月收支情况，给我推荐最适合的理财产品并说明原因。</textarea>
            </div>
            <button id="runBtn" type="button">运行 AI 财富顾问</button>
            <div class="muted-note">
                页面会先加载用户概览，再发起聊天接口。<br>
                最终结果会同时展示候选产品、LLM 最终推荐产品和自然语言回答。
            </div>
        </aside>

        <main class="content-stack">
            <section class="panel">
                <h2>用户概览</h2>
                <div id="overviewStatus" class="loading">正在加载用户列表...</div>
                <div id="overviewCards" class="card-grid" hidden></div>
            </section>

            <section class="panel">
                <h2>候选产品与 LLM 最终推荐</h2>
                <div id="recommendationGrid" class="card-grid" hidden></div>
                <div id="recommendationStatus" class="muted-note">请选择用户并运行。</div>
            </section>

            <section class="panel">
                <h2>AI 最终回答</h2>
                <div id="answerBox" class="answer">等待执行。</div>
            </section>
        </main>
    </section>
</div>

<script>
    const userSelect = document.getElementById("userSelect");
    const messageInput = document.getElementById("messageInput");
    const runBtn = document.getElementById("runBtn");
    const overviewStatus = document.getElementById("overviewStatus");
    const overviewCards = document.getElementById("overviewCards");
    const recommendationGrid = document.getElementById("recommendationGrid");
    const recommendationStatus = document.getElementById("recommendationStatus");
    const answerBox = document.getElementById("answerBox");

    async function request(url, options) {
        const response = await fetch(url, options);
        if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `HTTP ${response.status}`);
        }
        return response.json();
    }

    function money(value) {
        return new Intl.NumberFormat("zh-CN", {
            style: "currency",
            currency: "CNY",
            maximumFractionDigits: 2
        }).format(Number(value || 0));
    }

    function renderOverview(data) {
        overviewCards.hidden = false;
        overviewStatus.hidden = true;
        const monthly = data.monthlySummaries || [];
        const current = monthly[monthly.length - 1];
        overviewCards.innerHTML = `
            <div class="mini-card">
                <h3>用户画像</h3>
                <p>风险等级：${data.riskLevel}</p>
                <p>储蓄目标：${data.goalProjection.goalName}</p>
                <p>目标金额：${money(data.goalProjection.targetAmount)}</p>
            </div>
            <div class="mini-card">
                <h3>本月现金流</h3>
                <p>收入：${money(current?.income)}</p>
                <p>支出：${money(current?.expense)}</p>
                <p>净结余：${money(current?.netCashflow)}</p>
            </div>
            <div class="mini-card">
                <h3>目标预测</h3>
                <p>预计完成：${data.goalProjection.projectedCompletionDate}</p>
                <p>预计月投入：${money(data.goalProjection.projectedMonthlyContribution)}</p>
                <p>是否按期：${data.goalProjection.onTrack ? "是" : "否"}</p>
            </div>
            <div class="mini-card">
                <h3>建议摘要</h3>
                <div class="chips">
                    ${(data.advisoryHighlights || []).map(item => `<span class="chip">${item}</span>`).join("")}
                </div>
            </div>
        `;
    }

    function renderRecommendations(data) {
        recommendationGrid.hidden = false;
        recommendationStatus.textContent = data.llmSelectionSummary || "已完成推荐。";
        const candidateCards = (data.candidateProducts || []).map(item => `
            <div class="mini-card">
                <h3>候选产品 · ${item.productName}</h3>
                <p>编码：${item.productCode}</p>
                <p>年化收益：${item.annualReturnRate}</p>
                <p>最短持有：${item.minHoldingDays} 天</p>
                <p>流动性：${item.liquidityLevel}</p>
                <p>${item.reason}</p>
            </div>
        `);
        const finalCards = (data.finalRecommendedProducts || []).map(item => `
            <div class="mini-card">
                <h3>LLM 最终推荐 · ${item.productName}</h3>
                <p>编码：${item.productCode}</p>
                <p>${item.reason}</p>
            </div>
        `);
        recommendationGrid.innerHTML = [...candidateCards, ...finalCards].join("");
    }

    async function loadUsers() {
        const users = await request("/api/v1/wealth-advisor/users");
        userSelect.innerHTML = users.map(user => `
            <option value="${user.userId}">${user.fullName} · ${user.riskLevel}</option>
        `).join("");
        return users;
    }

    async function run() {
        const userId = Number(userSelect.value);
        const message = messageInput.value.trim();
        if (!userId || !message) {
            return;
        }

        runBtn.disabled = true;
        overviewStatus.hidden = false;
        overviewStatus.textContent = "正在分析用户财富数据...";
        recommendationStatus.textContent = "正在计算候选产品并调用大模型...";
        answerBox.textContent = "处理中...";

        try {
            const overview = await request(`/api/v1/wealth-advisor/users/${userId}/overview`);
            renderOverview(overview);
            const chat = await request("/api/v1/wealth-advisor/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({userId, message})
            });
            renderRecommendations(chat);
            answerBox.textContent = chat.answer || "未返回回答。";
        } catch (error) {
            overviewStatus.hidden = false;
            overviewStatus.textContent = "请求失败";
            recommendationStatus.textContent = error.message;
            answerBox.textContent = error.message;
        } finally {
            runBtn.disabled = false;
        }
    }

    runBtn.addEventListener("click", run);

    (async function init() {
        try {
            await loadUsers();
            overviewStatus.textContent = "用户已加载，请点击运行。";
        } catch (error) {
            overviewStatus.textContent = `用户加载失败：${error.message}`;
        }
    })();
</script>
</body>
</html>
