spring:
  application:
    name: smart-rag-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_wealth_ai}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        index-type: HNSW

demo:
  admin-key: ${DEMO_ADMIN_KEY:}
  rag:
    top-k: 4
    similarity-threshold: 0.35
    chunk-size: 500
    chunk-overlap: 50
    table-rows-per-chunk: 10
  image-search:
    model: multimodal-embedding-v1
    dimensions: 1024
    top-k: 5
    similarity-threshold: 0.0
  chat:
    temperature: 0.2
    max-tokens: 900

server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Real-IP
      protocol-header: X-Forwarded-Proto

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-ap-southeast-1-internal.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:smartwealth-product-images}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# --- IM Bot Config ---

wecom:
  enabled: ${WECOM_ENABLED:false}
  corp-id: ${WECOM_CORP_ID:}
  token: ${WECOM_TOKEN:}
  encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
  agent-id: ${WECOM_AGENT_ID:0}

slack:
  enabled: ${SLACK_ENABLED:false}
  client-id: ${SLACK_CLIENT_ID:}
  client-secret: ${SLACK_CLIENT_SECRET:}
  signing-secret: ${SLACK_SIGNING_SECRET:}
  bot-token: ${SLACK_BOT_TOKEN:}

# --- Document Sync Config ---

googledrive:
  enabled: ${GOOGLEDRIVE_ENABLED:false}
  client-id: ${GOOGLEDRIVE_CLIENT_ID:}
  client-secret: ${GOOGLEDRIVE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLEDRIVE_REDIRECT_URI:}
  folder-name: SmartRAG
  sync-interval-minutes: 10

onedrive:
  enabled: ${ONEDRIVE_ENABLED:false}
  client-id: ${ONEDRIVE_CLIENT_ID:}
  client-secret: ${ONEDRIVE_CLIENT_SECRET:}
  redirect-uri: ${ONEDRIVE_REDIRECT_URI:}
  tenant-id: ${ONEDRIVE_TENANT_ID:common}
  folder-name: SmartRAG
  sync-interval-minutes: 10

# --- WhatsApp Bot Config ---

whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}
  account-sid: ${WHATSAPP_ACCOUNT_SID:}
  auth-token: ${WHATSAPP_AUTH_TOKEN:}
  phone-number: ${WHATSAPP_PHONE_NUMBER:}

# --- Stripe ---
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  domain: ${APP_DOMAIN:http://localhost:8080}
  pricing:
    currency: ${PRICING_CURRENCY:SGD}
    trial-days: 7
    monthly:
      price-id: ${STRIPE_PRICE_MONTHLY_ID:}
      amount: ${PRICING_MONTHLY_AMOUNT:5.90}
      label: "Monthly"
    annual:
      price-id: ${STRIPE_PRICE_ANNUAL_ID:}
      amount: ${PRICING_ANNUAL_AMOUNT:59.00}
      label: "Annual"
