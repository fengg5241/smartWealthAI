spring:
  application:
    name: smart-rag-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_wealth_ai
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        index-type: HNSW

demo:
  rag:
    top-k: 4
    similarity-threshold: 0.35
    chunk-size: 500
    chunk-overlap: 50
    table-rows-per-chunk: 10
  chat:
    temperature: 0.2
    max-tokens: 900

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
