spring:
  application:
    name: smart-rag-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smart_wealth_ai}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        index-type: HNSW

demo:
  admin-key: ${DEMO_ADMIN_KEY:}
  rag:
    top-k: 4
    similarity-threshold: 0.35
    chunk-size: 500
    chunk-overlap: 50
    table-rows-per-chunk: 10
  image-search:
    model: multimodal-embedding-v1
    dimensions: 1024
    upload-dir: ${IMAGE_UPLOAD_DIR:uploads/products}
    top-k: 5
    similarity-threshold: 0.0
  chat:
    temperature: 0.2
    max-tokens: 900

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
