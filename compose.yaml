services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smart-wealth-ai-postgres
    environment:
      POSTGRES_DB: smart_wealth_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_wealth_ai"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
